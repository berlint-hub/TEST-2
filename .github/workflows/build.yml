name: Switch build

# VK-only (nxvk) full bundle.
# insumos:
#   - nxvk SDK: built from source (PalindromicBreadLoaf/nxvk, pinned below)
#     in the nxvk-sdk job, passed as an artifact. No prebuilt binaries in git.
#   - proprietary cores + assets: NOT in git. Supply via workflow_dispatch
#     input `cores_tarball_url` (pre-signed URL to a .tar.gz with
#     NetherSX2-v2.2n-4248/ and NetherSX2-v2.2n-3668/).
#     TEMP test hook: on push to main, falls back to the Catbox tarball so a
#     plain push builds FULL. Remove once dispatch-only flow is confirmed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "extras/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create rolling dev release (keeps latest 10 dev-*)"
        type: boolean
        default: true
      cores_tarball_url:
        description: "Optional pre-signed .tar.gz URL with APK trees (full bundle)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: switch-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NXVK_REV: e028d428c3b1f2dabadd81645c53cddfc8d7ab51

jobs:
  nxvk-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space (Mesa build is big)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Checkout nxvk (pinned)
        uses: actions/checkout@v4
        with:
          repository: PalindromicBreadLoaf/nxvk
          ref: ${{ env.NXVK_REV }}
          path: nxvk

      - name: Build toolchain image (retry, dkp flake)
        run: |
          set -euo pipefail
          cd nxvk
          for i in 1 2 3; do
            make image CONTAINER=docker && break
            echo "image build attempt $i failed, retrying..."
            sleep 30
            [ "$i" -lt 3 ] || exit 1
          done
          docker images | grep -i nxvk || true

      - name: Build + stage Vulkan package
        run: |
          set -euo pipefail
          cd nxvk
          make CONTAINER=docker
          test -f switch/build/pkg/lib/libnvk.a
          test -f switch/build/pkg/lib/libnvk_support.a
          du -sh switch/build/pkg switch/build/cross

      - name: Pack SDK artifact
        run: |
          set -euo pipefail
          tar -czf nxvk-sdk.tgz -C nxvk/switch/build/pkg .
          ls -la nxvk-sdk.tgz

      - name: Upload nxvk SDK
        uses: actions/upload-artifact@v4
        with:
          name: nxvk-sdk-${{ env.NXVK_REV }}
          path: nxvk-sdk.tgz
          retention-days: 7

  build:
    needs: nxvk-sdk
    runs-on: ubuntu-22.04
    # Official devkitPro image: DEVKITPRO=/opt/devkitpro, dkp-pacman, A64 base.
    container:
      image: devkitpro/devkita64:20260219
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      JOBS: "4"
    outputs:
      full: ${{ steps.bundle.outputs.full }}
    steps:
      - name: Ensure node/git/cmake for actions
        run: |
          set -euo pipefail
          command -v node >/dev/null 2>&1 || { apt-get update -y && apt-get install -y nodejs; }
          command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git; }
          command -v cmake >/dev/null 2>&1 || { apt-get update -y && apt-get install -y cmake ninja-build; }
          command -v curl >/dev/null 2>&1 || { apt-get update -y && apt-get install -y curl; }
          node --version
          git --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download nxvk SDK
        uses: actions/download-artifact@v4
        with:
          name: nxvk-sdk-${{ env.NXVK_REV }}
          path: sdk-tmp/

      - name: Unpack nxvk SDK
        run: |
          set -euo pipefail
          mkdir -p nxvk-sdk
          tar -xzf sdk-tmp/nxvk-sdk.tgz -C nxvk-sdk
          test -f nxvk-sdk/include/vulkan/vulkan_core.h
          test -f nxvk-sdk/lib/libnvk.a
          test -f nxvk-sdk/lib/libnvk_support.a
          echo "NXVK_SDK_ROOT=$GITHUB_WORKSPACE/nxvk-sdk" >> "$GITHUB_ENV"

      - name: Install Switch portlibs
        run: |
          set -euo pipefail
          # pkg.devkitpro.org sporadically 403s GitHub-runner IPs: retry sync.
          for i in 1 2 3 4 5; do
            dkp-pacman -Syu --noconfirm && break
            echo "dkp sync attempt $i failed, retrying in 30s..."
            sleep 30
            [ "$i" -lt 5 ] || exit 1
          done
          dkp-pacman -S --noconfirm --needed \
            devkitA64 switch-tools libnx \
            switch-sdl2 switch-sdl2_ttf switch-sdl2_image \
            switch-curl switch-mesa switch-libdrm_nouveau switch-ntfs-3g

      - name: Fetch proprietary cores (optional)
        id: cores
        # TEMPORARY test hook: on push to main, fall back to the Catbox tarball
        # (3668 tree in both slots) so a plain push builds FULL. Remove once
        # cores flow via workflow_dispatch input only.
        if: inputs.cores_tarball_url != '' || github.event_name == 'push'
        env:
          CORES_URL: ${{ inputs.cores_tarball_url }}
          CORES_FALLBACK_URL: https://files.catbox.moe/5g9cis.tgz
        run: |
          set -euo pipefail
          URL="${CORES_URL:-$CORES_FALLBACK_URL}"
          mkdir -p "$GITHUB_WORKSPACE/cores-in"
          curl -fL --retry 3 -o /tmp/cores.tgz "$URL"
          tar -xzf /tmp/cores.tgz -C "$GITHUB_WORKSPACE/cores-in"
          echo "CORES_DIR=$GITHUB_WORKSPACE/cores-in" >> "$GITHUB_ENV"
          for f in \
            "NetherSX2-v2.2n-4248/lib/arm64-v8a/libemucore.so" \
            "NetherSX2-v2.2n-4248/assets/GameIndex.yaml" \
            "NetherSX2-v2.2n-3668/lib/arm64-v8a/libemucore.so" \
            "NetherSX2-v2.2n-3668/assets/GameIndex.yaml"; do
            test -f "$GITHUB_WORKSPACE/cores-in/$f" || { echo "Missing: $f" >&2; exit 1; }
          done

      - name: Full bundle (VK-only)
        id: bundle
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          if [ -n "${CORES_DIR:-}" ]; then
            ./build_all.sh
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "No cores supplied - toolchain compile check only (dev artifact)."
            cmake -S launcher/dependencies -B launcher/dependencies/build -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build launcher/dependencies/build --parallel "$JOBS"
            make clean >/dev/null 2>&1 || true
            make -j"$JOBS"
            EMU_NRO=$(ls -t ./*.nro | head -n 1)
            cp -f "$EMU_NRO" NetherSX2_nx_vk_check.nro
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp -f NetherSX2.nro out/ 2>/dev/null || true
          cp -f NetherSX2_nx_vk_check.nro out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switch-nro-${{ github.sha }}
          path: out/
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.make_release == true)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: switch-nro-${{ github.sha }}
          path: out/

      - name: Create rolling dev release (keep latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ needs.build.outputs.full }}
        run: |
          set -euo pipefail
          TAG="dev-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"
          {
            echo "Automated Switch dev build from ${GITHUB_SHA}."
            echo ""
            echo "Renderer: Vulkan (nxvk) only; nxvk rev ${NXVK_REV:0:12}."
            if [ "$FULL" = "true" ]; then
              echo "Contents: FULL bundle (cores + launcher NetherSX2.nro)."
            else
              echo "Contents: PARTIAL dev artifacts only (NO emulator cores)."
              echo "NetherSX2_nx_vk_check.nro is NOT a working build - for toolchain checks."
            fi
          } > notes.md
          # shellcheck disable=SC2086
          gh release create "$TAG" --title "$TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY" out/*
          # Prune: keep latest 10 dev-* releases, delete older ones with tags.
          # Manual v* releases are never touched.
          mapfile -t OLD < <(gh release list --limit 100 -R "$GITHUB_REPOSITORY" \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[] | select(.tagName | startswith("dev-")) | .tagName')
          for t in ${OLD[@]+"${OLD[@]}"}; do
            [ -n "$t" ] || continue
            echo "Pruning old release: $t"
            gh release delete "$t" --yes --cleanup-tag -R "$GITHUB_REPOSITORY"
          done
          gh release list --limit 12 -R "$GITHUB_REPOSITORY"
