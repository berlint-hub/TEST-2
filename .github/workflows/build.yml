name: Switch build

# Builds NetherSX2.nro with devkitA64.
# Full bundle (cores + Vulkan + final NRO) needs proprietary inputs that are
# NOT in git (see .gitignore: /vulkan/, APK trees with libemucore.so).
# Without them CI builds: storage deps + emulator GL NRO + forwarder + launcher
# (renamed to NetherSX2-nocores.nro so nobody mistakes it for a working build).
# Supply cores via workflow_dispatch input `cores_tarball_url` (pre-signed URL
# to a .tar.gz containing NetherSX2-v2.2n-4248/ and NetherSX2-v2.2n-3668/).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "extras/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create rolling dev release (keeps latest 10 dev-*)"
        type: boolean
        default: true
      cores_tarball_url:
        description: "Optional pre-signed .tar.gz URL with APK trees (full bundle)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: switch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    # Official devkitPro image (Docker Hub, no Cloudflare block unlike
    # apt.devkitpro.org which 403s GitHub-runner IPs). Already contains
    # DEVKITPRO=/opt/devkitpro, dkp-pacman and the A64 toolchain base.
    container:
      image: devkitpro/devkita64:20260219
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      JOBS: "4"
    outputs:
      full: ${{ steps.bundle.outputs.full }}
      vk: ${{ steps.VK.outputs.built }}
    steps:
      - name: Ensure node/git/cmake for actions
        run: |
          set -euo pipefail
          command -v node >/dev/null 2>&1 || { apt-get update -y && apt-get install -y nodejs; }
          command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git; }
          command -v cmake >/dev/null 2>&1 || { apt-get update -y && apt-get install -y cmake ninja-build; }
          command -v curl >/dev/null 2>&1 || { apt-get update -y && apt-get install -y curl; }
          node --version
          git --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch portlibs
        run: |
          set -euo pipefail
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm --needed \
            devkitA64 switch-tools libnx \
            switch-sdl2 switch-sdl2_ttf switch-sdl2_image \
            switch-curl switch-mesa switch-libdrm_nouveau switch-ntfs-3g

      - name: Build storage dependencies (libsmb2, libusbhsfs)
        run: |
          set -euo pipefail
          cmake -S launcher/dependencies -B launcher/dependencies/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build launcher/dependencies/build --parallel "$JOBS"

      - name: Fetch proprietary cores (optional)
        id: cores
        # TEMPORARY test hook: on push to main, fall back to the Catbox tarball
        # (3668 tree in both slots) so a plain push builds FULL. Remove once
        # cores flow via workflow_dispatch input only.
        if: inputs.cores_tarball_url != '' || github.event_name == 'push'
        env:
          CORES_URL: ${{ inputs.cores_tarball_url }}
          CORES_FALLBACK_URL: https://files.catbox.moe/5g9cis.tgz
        run: |
          set -euo pipefail
          URL="${CORES_URL:-$CORES_FALLBACK_URL}"
          mkdir -p "$GITHUB_WORKSPACE/cores-in"
          curl -fL --retry 3 -o /tmp/cores.tgz "$URL"
          tar -xzf /tmp/cores.tgz -C "$GITHUB_WORKSPACE/cores-in"
          echo "CORES_DIR=$GITHUB_WORKSPACE/cores-in" >> "$GITHUB_ENV"
          for f in \
            "NetherSX2-v2.2n-4248/lib/arm64-v8a/libemucore.so" \
            "NetherSX2-v2.2n-4248/assets/GameIndex.yaml" \
            "NetherSX2-v2.2n-3668/lib/arm64-v8a/libemucore.so" \
            "NetherSX2-v2.2n-3668/assets/GameIndex.yaml"; do
            test -f "$GITHUB_WORKSPACE/cores-in/$f" || { echo "Missing: $f" >&2; exit 1; }
          done

      - name: Build emulator (OpenGL)
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          make clean >/dev/null 2>&1 || true
          make -j"$JOBS"
          # Makefile TARGET is the checkout dir name (TEST-2.nro here,
          # NetherSX2_nx.nro upstream) - normalize to canonical artifact name.
          EMU_NRO=$(ls -t ./*.nro | head -n 1)
          cp -f "$EMU_NRO" NetherSX2_nx_gl.nro

      - name: Build emulator (Vulkan NVK, if SDK present)
        id: VK
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          if [ -f vulkan/include/vulkan/vulkan_core.h ] || [ -n "${MESA_SDK_ROOT:-}" ]; then
            make clean >/dev/null 2>&1 || true
            make -j"$JOBS" RENDERER=VK
            EMU_NRO=$(ls -t ./*.nro | head -n 1)
            cp -f "$EMU_NRO" NetherSX2_nx_vk.nro
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "No vulkan/ SDK and no MESA_SDK_ROOT - skipping VK build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle cores and build launcher
        id: bundle
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          if [ -n "${CORES_DIR:-}" ]; then
            if [ -f vulkan/include/vulkan/vulkan_core.h ] || [ -n "${MESA_SDK_ROOT:-}" ]; then
              ./build_all.sh
            else
              # TEMPORARY (no Vulkan SDK, single 3668 core for both slots):
              # GL-only full bundle without build_all.sh (which mandates VK).
              # Remove once the single-core launcher lands.
              echo "No Vulkan SDK - GL-only full bundle (3668 core in both slots)."
              mkdir -p launcher/romfs/cores launcher/romfs/emu
              cp -f "$CORES_DIR/NetherSX2-v2.2n-4248/lib/arm64-v8a/libemucore.so" launcher/romfs/cores/emucore_4248.so
              cp -f "$CORES_DIR/NetherSX2-v2.2n-3668/lib/arm64-v8a/libemucore.so" launcher/romfs/cores/emucore_3668.so
              cp -f NetherSX2_nx_gl.nro launcher/romfs/emu/NetherSX2_nx_gl.nro
              for b in 4248 3668; do
                rd="launcher/romfs/res/$b"
                rm -rf "$rd"; mkdir -p "$rd"
                cp -rf "$CORES_DIR/NetherSX2-v2.2n-$b/assets/." "$rd/"
                rm -rf "$rd/dexopt"
              done
              make -C launcher/fwd -j"$JOBS"
              (cd launcher && make -j"$JOBS")
              mv -f launcher/NetherSX2.nro NetherSX2.nro
            fi
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "No cores supplied - launcher built WITHOUT emulator cores (dev artifact only)."
            make -C launcher/fwd -j"$JOBS"
            (cd launcher && make -j"$JOBS")
            mv -f launcher/NetherSX2.nro NetherSX2-nocores.nro
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp -f NetherSX2_nx_gl.nro out/ 2>/dev/null || true
          cp -f NetherSX2_nx_vk.nro out/ 2>/dev/null || true
          cp -f NetherSX2.nro out/ 2>/dev/null || true
          cp -f NetherSX2-nocores.nro out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switch-nro-${{ github.sha }}
          path: out/
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.make_release == true)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: switch-nro-${{ github.sha }}
          path: out/

      - name: Create rolling dev release (keep latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ needs.build.outputs.full }}
          VK: ${{ needs.build.outputs.vk }}
        run: |
          set -euo pipefail
          TAG="dev-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA:0:7}"
          {
            echo "Automated Switch dev build from ${GITHUB_SHA}."
            echo ""
            if [ "$FULL" = "true" ]; then
              echo "Contents: FULL bundle (cores + launcher NetherSX2.nro)."
            else
              echo "Contents: PARTIAL dev artifacts only (NO emulator cores)."
              echo "NetherSX2-nocores.nro is NOT a working build - for toolchain/smoke checks."
            fi
            echo "Vulkan NVK backend: $VK"
          } > notes.md
          # shellcheck disable=SC2086
          gh release create "$TAG" --title "$TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY" out/*
          # Prune: keep latest 10 dev-* releases, delete older ones with tags.
          # Manual v* releases are never touched.
          mapfile -t OLD < <(gh release list --limit 100 -R "$GITHUB_REPOSITORY" \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[] | select(.tagName | startswith("dev-")) | .tagName')
          for t in ${OLD[@]+"${OLD[@]}"}; do
            [ -n "$t" ] || continue
            echo "Pruning old release: $t"
            gh release delete "$t" --yes --cleanup-tag -R "$GITHUB_REPOSITORY"
          done
          gh release list --limit 12 -R "$GITHUB_REPOSITORY"
